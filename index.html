<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pata Link - WhatsApp Group Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #07070f; color: #fff; min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; justify-content: space-between; }
        
        .bg-glow { position: absolute; width: 400px; height: 400px; background: rgba(79, 70, 229, 0.15); filter: blur(120px); border-radius: 50%; z-index: -1; top: 10%; left: 50%; transform: translateX(-50%); pointer-events: none; }

        header { padding: 20px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(10,10,20,0.8); backdrop-filter: blur(16px); position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 10px; background: linear-gradient(135deg, #4f46e5, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .main-container { width: 100%; max-width: 1200px; margin: auto; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; flex: 1; justify-content: center; }
        
        .carousel-container { position: relative; width: 100%; height: 520px; display: flex; justify-content: center; align-items: center; perspective: 1200px; touch-action: pan-y; }
        .carousel-track { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1); }

        .carousel-card {
            position: absolute;
            width: 340px;
            background: rgba(20, 20, 35, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            user-select: none;
        }

        .card-media { width: 100%; height: 180px; position: relative; background: #111; overflow: hidden; }
        .card-media img, .card-media video { width: 100%; height: 100%; object-fit: cover; }
        
        .card-body { padding: 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .card-category { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #818cf8; background: rgba(129, 140, 248, 0.1); padding: 4px 10px; border-radius: 20px; width: max-content; }
        .card-title { font-size: 18px; font-weight: 700; color: #fff; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .card-desc { font-size: 13px; color: #94a3b8; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06); }
        .card-price { font-size: 16px; font-weight: 800; color: #34d399; }
        
        .buy-btn { background: linear-gradient(135deg, #4f46e5, #6366f1); color: white; border: none; padding: 8px 18px; border-radius: 12px; font-weight: 600; font-size: 13px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4); }
        .buy-btn:hover { transform: scale(1.05); background: linear-gradient(135deg, #4338ca, #4f46e5); }

        .carousel-controls { display: flex; align-items: center; gap: 20px; margin-top: 30px; }
        .control-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); color: #fff; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; font-size: 16px; backdrop-filter: blur(10px); }
        .control-btn:hover { background: #4f46e5; border-color: #4f46e5; transform: scale(1.1); }
        
        .dots-container { display: flex; gap: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2); cursor: pointer; transition: 0.3s; }
        .dot.active { width: 24px; border-radius: 4px; background: #4f46e5; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal.show { display: flex; }
        .modal-box { background: #121222; border: 1px solid rgba(255,255,255,0.12); width: 100%; max-width: 420px; border-radius: 24px; padding: 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.8); }
        .modal-box h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .modal-box p { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; text-transform: uppercase; }
        .form-group input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #4f46e5; }
        
        .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
        .btn-cancel { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; flex: 1; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .btn-submit { background: #4f46e5; color: #fff; border: none; flex: 1; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; }

        footer { text-align: center; padding: 20px; font-size: 12px; color: #64748b; border-top: 1px solid rgba(255,255,255,0.05); }

        @media(max-width: 768px) {
            .carousel-container { height: 460px; }
            .carousel-card { width: 280px; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <header>
        <div class="logo"><i class="fas fa-comments"></i> Pata Link</div>
    </header>

    <div class="main-container">
        <div class="carousel-container" id="carouselContainer">
            <div class="carousel-track" id="carouselTrack"></div>
        </div>

        <div class="carousel-controls">
            <button class="control-btn" id="prevBtn"><i class="fas fa-chevron-left"></i></button>
            <div class="dots-container" id="dotsContainer"></div>
            <button class="control-btn" id="nextBtn"><i class="fas fa-chevron-right"></i></button>
        </div>
    </div>

    <div class="modal" id="checkoutModal">
        <div class="modal-box">
            <h3>Kamilisha Malipo</h3>
            <p id="modalProductTitle">Nunua Group Link</p>
            <form id="paymentForm">
                <div class="form-group">
                    <label>Namba ya Simu (M-Pesa / TigoPesa / Airtel)</label>
                    <input type="text" id="payPhone" placeholder="0712345678" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Ghairi</button>
                    <button type="submit" class="btn-submit" id="paySubmitBtn">Lipa Sasa</button>
                </div>
            </form>
        </div>
    </div>

    <footer>&copy; 2026 Pata Link WhatsApp Groups. All rights reserved.</footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCvQGF9i7EAcUz72-1EriDJzc7Mcxvq-r0",
            authDomain: "pata-link-za-magroup-whatsapp.firebaseapp.com",
            projectId: "pata-link-za-magroup-whatsapp",
            storageBucket: "pata-link-za-magroup-whatsapp.firebasestorage.app",
            messagingSenderId: "603411167221",
            appId: "1:603411167221:web:67c1e724e1cc93299c92bc",
            measurementId: "G-RZJ0E92YF7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let products = [];
        let currentIndex = 0;
        let autoRotateInterval;
        let selectedProduct = null;

        async function fetchProducts() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                products = [];
                querySnapshot.forEach((doc) => {
                    products.push({ id: doc.id, ...doc.data() });
                });

                if (products.length > 0) {
                    renderCarousel();
                    startAutoRotate();
                } else {
                    document.getElementById('carouselTrack').innerHTML = '<p style="color:#64748b;">Hakuna magroup yaliyowekwa.</p>';
                }
            } catch (error) {
                console.error("Error:", error);
            }
        }

        function renderCarousel() {
            const track = document.getElementById('carouselTrack');
            const dotsContainer = document.getElementById('dotsContainer');
            track.innerHTML = '';
            dotsContainer.innerHTML = '';

            products.forEach((p, index) => {
                const card = document.createElement('div');
                card.className = 'carousel-card';
                card.innerHTML = `
                    <div class="card-media">
                        ${p.videoUrl ? `<video src="${p.videoUrl}" autoplay muted loop playsinline></video>` : `<img src="${p.imageUrl || 'https://via.placeholder.com/300'}" alt="${p.title}">`}
                    </div>
                    <div class="card-body">
                        <span class="card-category">${p.category || 'WhatsApp'}</span>
                        <h4 class="card-title">${p.title}</h4>
                        <p class="card-desc">${p.description}</p>
                        <div class="card-footer">
                            <span class="card-price">TSh ${(p.price || 0).toLocaleString()}</span>
                            <button class="buy-btn" onclick="openCheckout('${p.id}')">BUY NOW</button>
                        </div>
                    </div>
                `;
                track.appendChild(card);

                const dot = document.createElement('div');
                dot.className = `dot ${index === currentIndex ? 'active' : ''}`;
                dot.onclick = () => { currentIndex = index; updateCarousel(); resetAutoRotate(); };
                dotsContainer.appendChild(dot);
            });

            updateCarousel();
        }

        function updateCarousel() {
            const cards = document.querySelectorAll('.carousel-card');
            if (cards.length === 0) return;

            const total = cards.length;
            cards.forEach((card, i) => {
                let offset = (i - currentIndex + total) % total;
                if (offset > total / 2) offset -= total;

                let x = offset * 240;
                let scale = offset === 0 ? 1 : 0.82;
                let zIndex = total - Math.abs(offset);
                let opacity = Math.abs(offset) > 2 ? 0 : 1 - Math.abs(offset) * 0.35;
                let rotateY = offset * -15;

                card.style.transform = `translateX(${x}px) translateZ(${offset === 0 ? 50 : -100}px) rotateY(${rotateY}deg) scale(${scale})`;
                card.style.zIndex = zIndex;
                card.style.opacity = opacity;
                card.style.pointerEvents = Math.abs(offset) > 1 ? 'none' : 'auto';
            });

            document.querySelectorAll('.dot').forEach((d, idx) => {
                d.classList.toggle('active', idx === currentIndex);
            });
        }

        function nextSlide() {
            if (products.length === 0) return;
            currentIndex = (currentIndex + 1) % products.length;
            updateCarousel();
        }

        function prevSlide() {
            if (products.length === 0) return;
            currentIndex = (currentIndex - 1 + products.length) % products.length;
            updateCarousel();
        }

        document.getElementById('nextBtn').onclick = () => { nextSlide(); resetAutoRotate(); };
        document.getElementById('prevBtn').onclick = () => { prevSlide(); resetAutoRotate(); };

        function startAutoRotate() {
            autoRotateInterval = setInterval(nextSlide, 4000);
        }

        function resetAutoRotate() {
            clearInterval(autoRotateInterval);
            startAutoRotate();
        }

        const container = document.getElementById('carouselContainer');
        let startX = 0;
        container.addEventListener('touchstart', e => { startX = e.touches[0].clientX; clearInterval(autoRotateInterval); });
        container.addEventListener('touchend', e => {
            let diff = e.changedTouches[0].clientX - startX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) prevSlide(); else nextSlide();
            }
            startAutoRotate();
        });

        window.openCheckout = function(productId) {
            selectedProduct = products.find(p => p.id === productId);
            if (!selectedProduct) return;
            document.getElementById('modalProductTitle').textContent = selectedProduct.title + ' - TSh ' + (selectedProduct.price || 0).toLocaleString();
            document.getElementById('checkoutModal').classList.add('show');
            clearInterval(autoRotateInterval);
        };

        window.closeModal = function() {
            document.getElementById('checkoutModal').classList.remove('show');
            startAutoRotate();
        };

        document.getElementById('paymentForm').onsubmit = async function(e) {
            e.preventDefault();
            const phone = document.getElementById('payPhone').value.trim();
            const btn = document.getElementById('paySubmitBtn');
            if (!phone) return alert('Weka namba ya simu');

            btn.textContent = 'Inatuma USSD Push...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/v1/collect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phone: phone,
                        amount: selectedProduct.price,
                        description: selectedProduct.title,
                        whatsappLink: selectedProduct.whatsappLink
                    })
                });
                const data = await response.json();
                if (data.success || data.order_id) {
                    alert('USSD Push imetumwa kwenye simu yako! Weka namba ya siri kukamilisha malipo.');
                    closeModal();
                } else {
                    alert('Imeshindikana: ' + (data.message || 'Jaribu tena'));
                }
            } catch (err) {
                console.error(err);
                alert('Hitilafu ya mtandao.');
            } finally {
                btn.textContent = 'Lipa Sasa';
                btn.disabled = false;
            }
        };

        fetchProducts();
    </script>
</body>
</html>
