<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tazama Video</title>
    <style>
        body { font-family: Arial, sans-serif; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { width: 100%; max-width: 450px; position: relative; text-align: center; }
        video { width: 100%; border-radius: 8px; display: block; }
        
        /* Bango kubwa linalotokea video ikisimama */
        #paymentModal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 8px;
            z-index: 10;
        }
        .modal-box {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            box-shadow: 0 4px 20px rgba(0,255,136,0.3);
        }
        h3 { color: #00ff88; margin-top: 0; font-size: 18px; }
        .price-txt { font-size: 20px; font-weight: bold; margin: 15px 0; color: #fff; background: #2a2a2a; padding: 10px; border-radius: 6px; }
        input { width: 100%; padding: 14px; margin-top: 10px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 16px; text-align: center; }
        button { width: 100%; margin-top: 15px; padding: 14px; background: #00ff88; color: #000; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background: #00cc6a; }
        .msg { margin-top: 15px; font-size: 14px; word-break: break-all; }
        a.link-btn { display: inline-block; margin-top: 15px; padding: 12px; background: #25D366; color: #fff; text-decoration: none; font-weight: bold; border-radius: 6px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Video ya kuanzia (Hakikisha faili au link ya video ipo, unaweza kubadilisha src) -->
        <video id="promoVideo" controls autoplay>
            <source src="video.mp4" type="video/mp4">
            Kivinjari chako hakihimili video.
        </video>

        <!-- Bango Kubwa la Malipo linapoisimama au kuisha video -->
        <div id="paymentModal">
            <div class="modal-box">
                <h3>Lipia ili kuendelea kutazama video kamili!</h3>
                <div id="priceDisplay" class="price-txt">Inapakia bei...</div>
                <p style="font-size: 13px; color: #aaa; margin: 5px 0;">Lipa kwa Airtel Money / M-Pesa / TigoPesa</p>

                <form id="paymentForm">
                    <input type="text" id="phoneInput" required placeholder="Weka namba ya simu (Mfano: 0712345678)">
                    <button type="submit" id="payBtn">Lipia Sasa</button>
                </form>

                <div id="msg" class="msg"></div>
            </div>
        </div>
    </div>

    <script>
        let currentPrice = 1000;
        const video = document.getElementById('promoVideo');
        const paymentModal = document.getElementById('paymentModal');

        // Kupata bei halisi kutoka kwenye Server/Database ya Admin
        async function fetchSettings() {
            try {
                const res = await fetch('/api/settings');
                const data = await res.json();
                if (data.success) {
                    currentPrice = data.price || 1000;
                    document.getElementById('priceDisplay').innerText = `Bei: TZS ${currentPrice.toLocaleString()}`;
                }
            } catch (e) {
                document.getElementById('priceDisplay').innerText = `Bei: TZS 1,000`;
            }
        }
        fetchSettings();

        // Video ikiisha (ended), bango kubwa linatokea
        video.addEventListener('ended', () => {
            paymentModal.style.display = 'flex';
        });

        // Video ikisimamishwa (pause) na mtumiaji kabla haijaisha, bango linatokea pia
        video.addEventListener('pause', () => {
            // Unaweza kuondoa mstari huu kama hutaki isimame katikati ya uchezaji wa kawaida
            if (!video.ended && video.currentTime > 1) {
                // paymentModal.style.display = 'flex';
            }
        });

        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phoneInput').value;
            const msg = document.getElementById('msg');
            const payBtn = document.getElementById('payBtn');

            msg.style.color = '#fff';
            msg.innerText = 'Inatuma ombi la malipo kwenye simu yako...';
            payBtn.disabled = true;

            try {
                const res = await fetch('/api/v1/collect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: phone, amount: currentPrice })
                });
                const data = await res.json();

                if (data.success) {
                    msg.style.color = '#00ff88';
                    msg.innerText = 'USSD push imetumwa kwenye simu yako. Weka namba ya siri kulipia.';
                    
                    const orderId = data.order_id;
                    let checkInterval = setInterval(async () => {
                        try {
                            const statusRes = await fetch('/api/v1/check-status', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ order_id: orderId })
                            });
                            const statusData = await statusRes.json();
                            if (statusData.success && statusData.status === 'completed') {
                                clearInterval(checkInterval);
                                msg.innerHTML = `Malipo yamekamilika! Bonyeza hapa chini kutazama video au kuingia:<br><a class="link-btn" href="${statusData.groupLink}" target="_blank">Fungua Video / Group</a>`;
                                paymentModal.style.display = 'none'; // Kuficha bango ili mtumiaji aendelee
                                video.play();
                            }
                        } catch (err) {
                            console.error(err);
                        }
                    }, 4000);

                } else {
                    msg.style.color = '#ff4444';
                    msg.innerText = data.message || 'Imeshindikana kutuma ombi.';
                    payBtn.disabled = false;
                }
            } catch (err) {
                msg.style.color = '#ff4444';
                msg.innerText = 'Hitilafu ya mtandao.';
                payBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
