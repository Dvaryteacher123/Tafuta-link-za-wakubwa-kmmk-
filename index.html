<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pata Link za WhatsApp - 3D Diagonal Flow</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* RESET & BASE - WHITE THEME */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* HEADER - Glassmorphism Light */
        header {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
        }
        header h1 {
            font-size: 18px;
            font-weight: 900;
            background: linear-gradient(135deg, #0ea5e9, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            gap: 8px;
            align-items: center;
            letter-spacing: -0.5px;
        }
        header h1 i {
            -webkit-text-fill-color: #0ea5e9;
            font-size: 20px;
        }
        .header-nav {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-link-btn {
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.06);
            padding: 6px 12px;
            border-radius: 30px;
            color: #1e293b;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }
        .nav-link-btn:hover {
            background: rgba(0, 0, 0, 0.08);
            border-color: rgba(0, 0, 0, 0.12);
        }
        .nav-link-btn.whatsapp {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.2);
            color: #0b7a4b;
        }
        .nav-link-btn.whatsapp:hover {
            background: rgba(16, 185, 129, 0.25);
        }
        .nav-link-btn.primary {
            background: #0ea5e9;
            border-color: #0ea5e9;
            color: #fff;
        }
        .nav-link-btn.primary:hover {
            background: #38bdf8;
            border-color: #38bdf8;
        }

        /* 3D DIAGONAL CONTAINER */
        .diagonal-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1200px;
            padding: 20px 10px 40px 10px;
            min-height: 70vh;
            position: relative;
        }

        .diagonal-track {
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 540px;
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* CARD 3D - WHITE THEME */
        .card-3d {
            position: absolute;
            width: 280px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 4px 12px rgba(0, 0, 0, 0.03);
            transition: all 0.65s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            will-change: transform, opacity, filter;
            cursor: grab;
            display: flex;
            flex-direction: column;
            backface-visibility: hidden;
        }
        .card-3d:active {
            cursor: grabbing;
        }
        .card-3d .card-media {
            width: 100%;
            height: 200px;
            background: #e2e8f0;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .card-3d .card-media img,
        .card-3d .card-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card-3d .card-body {
            padding: 16px 18px 18px 18px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-3d .card-body h3 {
            font-size: 17px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 4px;
            letter-spacing: -0.3px;
        }
        .card-3d .card-body .desc {
            font-size: 12px;
            color: #475569;
            line-height: 1.4;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-3d .card-body .price {
            font-size: 18px;
            font-weight: 800;
            color: #0ea5e9;
            margin-bottom: 10px;
        }
        .card-3d .card-body .btn-buy-3d {
            width: 100%;
            padding: 11px 0;
            background: linear-gradient(135deg, #0ea5e9, #7c3aed);
            border: none;
            border-radius: 50px;
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(14, 165, 233, 0.25);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .card-3d .card-body .btn-buy-3d:active {
            transform: scale(0.95);
        }

        /* POSITIONS FOR DIAGONAL FLOW */
        .card-3d.pos-0 {
            transform: translateX(0px) translateY(0px) translateZ(120px) rotateY(-8deg) scale(1);
            opacity: 1;
            z-index: 10;
            filter: blur(0px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.1), 0 0 30px rgba(14, 165, 233, 0.15);
            border-color: rgba(14, 165, 233, 0.2);
        }
        .card-3d.pos-1 {
            transform: translateX(120px) translateY(70px) translateZ(60px) rotateY(-12deg) scale(0.9);
            opacity: 0.7;
            z-index: 7;
            filter: blur(1px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
            border-color: rgba(0, 0, 0, 0.04);
        }
        .card-3d.pos-2 {
            transform: translateX(200px) translateY(150px) translateZ(0px) rotateY(-16deg) scale(0.78);
            opacity: 0.45;
            z-index: 4;
            filter: blur(2px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.04);
        }
        .card-3d.pos--1 {
            transform: translateX(-120px) translateY(70px) translateZ(60px) rotateY(-4deg) scale(0.9);
            opacity: 0.7;
            z-index: 7;
            filter: blur(1px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
            border-color: rgba(0, 0, 0, 0.04);
        }
        .card-3d.pos--2 {
            transform: translateX(-200px) translateY(150px) translateZ(0px) rotateY(0deg) scale(0.78);
            opacity: 0.45;
            z-index: 4;
            filter: blur(2px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.04);
        }
        .card-3d.pos-hidden {
            transform: translateX(0px) translateY(300px) translateZ(-200px) scale(0.5);
            opacity: 0;
            z-index: 0;
            filter: blur(6px);
            pointer-events: none;
        }

        /* NAVIGATION DOTS & BUTTONS */
        .diagonal-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 10px 0 20px 0;
            flex-shrink: 0;
        }
        .diagonal-nav .nav-btn {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.06);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            color: #0f172a;
            font-size: 16px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .diagonal-nav .nav-btn:active {
            transform: scale(0.9);
        }
        .diagonal-nav .dots {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .diagonal-nav .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.15);
            transition: 0.3s;
            cursor: pointer;
        }
        .diagonal-nav .dot.active {
            width: 24px;
            border-radius: 4px;
            background: #0ea5e9;
        }

        /* FOOTER SUPPORT */
        .footer-support {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            padding: 14px 20px;
            text-align: center;
            font-size: 13px;
            color: #475569;
            flex-shrink: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px 16px;
        }
        .footer-support a {
            color: #0ea5e9;
            text-decoration: none;
            font-weight: 600;
        }
        .footer-support a:hover {
            text-decoration: underline;
        }
        .footer-support i {
            margin-right: 4px;
        }

        /* MODALS - LIGHT THEME */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: modalFadeIn 0.35s ease;
        }
        .modal.show {
            display: flex;
        }
        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(10px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 28px;
            padding: 32px 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        .modal-content h3 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 4px;
            color: #0f172a;
            letter-spacing: -0.3px;
        }
        .modal-content .subtitle {
            color: #475569;
            font-size: 13px;
            margin-bottom: 22px;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 11px;
            margin-bottom: 5px;
            color: #475569;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 13px 16px;
            background: rgba(241, 245, 249, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 14px;
            color: #0f172a;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 24px;
        }
        .btn-cancel {
            background: transparent;
            border: 1px solid rgba(0, 0, 0, 0.08);
            color: #475569;
            padding: 11px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: 0.3s;
        }
        .btn-cancel:hover {
            background: rgba(0, 0, 0, 0.02);
        }
        .btn-submit {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            color: #fff;
            padding: 11px 24px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.25);
            transition: 0.3s;
        }
        .btn-submit:active {
            transform: scale(0.96);
        }

        /* Order items */
        .order-item-card {
            background: rgba(241, 245, 249, 0.7);
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        .order-info h4 {
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 2px;
        }
        .order-info p {
            font-size: 12px;
            color: #475569;
        }
        .badge-status {
            padding: 3px 10px;
            border-radius: 50px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            display: inline-block;
        }
        .badge-completed {
            background: rgba(16, 185, 129, 0.15);
            color: #0b7a4b;
            border: 1px solid rgba(16, 185, 129, 0.15);
        }
        .badge-pending {
            background: rgba(245, 158, 11, 0.15);
            color: #b45309;
            border: 1px solid rgba(245, 158, 11, 0.15);
        }
        .btn-access-link {
            background: rgba(14, 165, 233, 0.12);
            color: #0ea5e9;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
            border: 1px solid rgba(14, 165, 233, 0.12);
            transition: 0.3s;
        }
        .btn-access-link:hover {
            background: rgba(14, 165, 233, 0.2);
        }
        .search-row {
            display: flex;
            gap: 8px;
        }
        .search-row input {
            flex: 1;
        }
        .search-row .btn-submit {
            padding: 0 16px;
            white-space: nowrap;
        }
        #myOrdersResult {
            max-height: 220px;
            overflow-y: auto;
            margin-top: 12px;
        }
        #myOrdersResult::-webkit-scrollbar {
            width: 3px;
        }
        #myOrdersResult::-webkit-scrollbar-track {
            background: transparent;
        }
        #myOrdersResult::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .diagonal-track {
                height: 480px;
            }
            .card-3d {
                width: 240px;
            }
            .card-3d .card-media {
                height: 170px;
            }
            .card-3d.pos-1 {
                transform: translateX(90px) translateY(60px) translateZ(40px) rotateY(-12deg) scale(0.85);
            }
            .card-3d.pos--1 {
                transform: translateX(-90px) translateY(60px) translateZ(40px) rotateY(-4deg) scale(0.85);
            }
            .card-3d.pos-2 {
                transform: translateX(150px) translateY(120px) translateZ(0px) rotateY(-16deg) scale(0.7);
            }
            .card-3d.pos--2 {
                transform: translateX(-150px) translateY(120px) translateZ(0px) rotateY(0deg) scale(0.7);
            }
            .card-3d.pos-0 {
                transform: translateX(0px) translateY(0px) translateZ(80px) rotateY(-6deg) scale(1);
            }
            .footer-support {
                font-size: 11px;
                padding: 10px 12px;
                flex-direction: column;
                gap: 2px;
            }
        }
        @media (max-width: 420px) {
            .card-3d {
                width: 200px;
            }
            .card-3d .card-media {
                height: 140px;
            }
            .card-3d .card-body {
                padding: 12px 14px 14px 14px;
            }
            .card-3d .card-body h3 {
                font-size: 15px;
            }
            .card-3d .card-body .price {
                font-size: 16px;
            }
            .diagonal-track {
                height: 420px;
            }
            .card-3d.pos-1 {
                transform: translateX(70px) translateY(50px) translateZ(30px) rotateY(-12deg) scale(0.8);
            }
            .card-3d.pos--1 {
                transform: translateX(-70px) translateY(50px) translateZ(30px) rotateY(-4deg) scale(0.8);
            }
            .card-3d.pos-2 {
                transform: translateX(120px) translateY(100px) translateZ(0px) rotateY(-16deg) scale(0.65);
            }
            .card-3d.pos--2 {
                transform: translateX(-120px) translateY(100px) translateZ(0px) rotateY(0deg) scale(0.65);
            }
            .card-3d.pos-0 {
                transform: translateX(0px) translateY(0px) translateZ(60px) rotateY(-6deg) scale(1);
            }
        }
    </style>
</head>

        let products = [];
        let currentIndex = 0;
        let currentUser = JSON.parse(localStorage.getItem('pataLinkUser')) || null;

        // DOM refs
        const track = document.getElementById('diagonalTrack');
        const dotsContainer = document.getElementById('dotsContainer3d');
        const prevBtn = document.getElementById('prevBtn3d');
        const nextBtn = document.getElementById('nextBtn3d');

        // --- Auth UI ---
        function updateAuthUI() {
            const topBtn = document.querySelector('.nav-link-btn.primary');
            if (currentUser) {
                topBtn.textContent = 'Logout';
                topBtn.onclick = () => {
                    localStorage.removeItem('pataLinkUser');
                    currentUser = null;
                    updateAuthUI();
                    alert('Umejitenga.');
                };
            } else {
                topBtn.textContent = 'Signup';
                topBtn.onclick = () => openAuthModal('signup');
            }
        }
        updateAuthUI();

        // --- Render 3D Cards ---
        function renderCards() {
            if (!products.length) {
                track.innerHTML = `
                    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#475569;gap:12px;text-align:center;width:100%;">
                        <i class="fas fa-box-open" style="font-size:40px;color:#94a3b8;"></i>
                        <p style="font-weight:500;">Hakuna magroup yaliyowekwa bado.</p>
                        <p style="font-size:13px;color:#94a3b8;">Admin ataanza kuongeza hivi karibuni.</p>
                    </div>
                `;
                dotsContainer.innerHTML = '';
                return;
            }

            // Build dots
            let dotsHtml = '';
            products.forEach((_, i) => {
                dotsHtml += `<div class="dot ${i === currentIndex ? 'active' : ''}" data-index="${i}"></div>`;
            });
            dotsContainer.innerHTML = dotsHtml;

            // Build cards
            const total = products.length;
            let html = '';
            products.forEach((p, idx) => {
                const offset = (idx - currentIndex + total) % total;
                let posClass = 'pos-hidden';
                if (offset === 0) posClass = 'pos-0';
                else if (offset === 1) posClass = 'pos-1';
                else if (offset === 2) posClass = 'pos-2';
                else if (offset === total - 1) posClass = 'pos--1';
                else if (offset === total - 2) posClass = 'pos--2';

                let mediaHtml = `<img src="${p.imageUrl || 'https://via.placeholder.com/400x200/e2e8f0/94a3b8?text=Group'}" alt="${p.title}" loading="lazy" />`;
                if (p.videoUrl) {
                    mediaHtml = `<video src="${p.videoUrl}" autoplay muted loop playsinline></video>`;
                }

                html += `
                    <div class="card-3d ${posClass}" data-index="${idx}">
                        <div class="card-media">${mediaHtml}</div>
                        <div class="card-body">
                            <div>
                                <h3>${p.title}</h3>
                                <p class="desc">${p.description || 'Hakuna maelezo.'}</p>
                            </div>
                            <div>
                                <div class="price">TSh ${(p.price || 0).toLocaleString()}</div>
                                <button class="btn-buy-3d" onclick="handleBuy('${p.id}', '${p.title.replace(/'/g, "\\'")}', ${p.price || 0})">
                                    <i class="fas fa-bolt"></i> NUNUA SASA
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
            track.innerHTML = html;

            // Attach dot click events
            document.querySelectorAll('.dot').forEach(dot => {
                dot.addEventListener('click', () => {
                    const idx = parseInt(dot.dataset.index);
                    if (idx !== currentIndex) {
                        currentIndex = idx;
                        renderCards();
                    }
                });
            });
        }

        // --- Navigation ---
        function nextSlide() {
            if (!products.length) return;
            currentIndex = (currentIndex + 1) % products.length;
            renderCards();
        }

        function prevSlide() {
            if (!products.length) return;
            currentIndex = (currentIndex - 1 + products.length) % products.length;
            renderCards();
        }

        prevBtn.addEventListener('click', prevSlide);
        nextBtn.addEventListener('click', nextSlide);

        // --- Swipe / Drag ---
        let startX = 0,
            isDragging = false;
        const container = document.querySelector('.diagonal-container');

        container.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
        }, { passive: true });

        container.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const diff = startX - e.touches[0].clientX;
            if (Math.abs(diff) > 40) {
                if (diff > 0) nextSlide();
                else prevSlide();
                isDragging = false;
            }
        }, { passive: true });

        container.addEventListener('touchend', () => { isDragging = false; }, { passive: true });

        // Mouse drag
        let mouseDown = false,
            mouseStartX = 0;
        container.addEventListener('mousedown', (e) => {
            mouseDown = true;
            mouseStartX = e.clientX;
        });
        container.addEventListener('mousemove', (e) => {
            if (!mouseDown) return;
            const diff = mouseStartX - e.clientX;
            if (Math.abs(diff) > 40) {
                if (diff > 0) nextSlide();
                else prevSlide();
                mouseDown = false;
            }
        });
        container.addEventListener('mouseup', () => { mouseDown = false; });
        container.addEventListener('mouseleave', () => { mouseDown = false; });

        // --- Fetch Products ---
        async function fetchProducts() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                products = [];
                querySnapshot.forEach((doc) => {
                    products.push({ id: doc.id, ...doc.data() });
                });
                renderCards();
            } catch (e) {
                console.error(e);
                track.innerHTML = `<p style="color:#ef4444;text-align:center;width:100%;">Imeshindikana kupakia data.</p>`;
            }
        }

        // --- Buy Handler (requires login) ---
        window.handleBuy = function(id, title, price) {
            if (!currentUser) {
                alert('⚠️ Lazima uwe umeingia (Login) au kujisajili (Signup) kabla ya kununua.');
                openAuthModal('login');
                return;
            }
            // Proceed to checkout
            document.getElementById('checkoutModal').classList.add('show');
            document.getElementById('modalItemTitle').textContent = title + ' — TSh ' + price.toLocaleString();
            document.getElementById('payProductId').value = id;
            document.getElementById('payAmount').value = price;
            document.getElementById('payDescription').value = 'Malipo ya Group: ' + title;
        };

        // --- Checkout Modal ---
        window.closeCheckout = function() {
            document.getElementById('checkoutModal').classList.remove('show');
        };

        // --- My Orders Modal ---
        window.openMyOrdersModal = function() {
            document.getElementById('myOrdersModal').classList.add('show');
            document.getElementById('myOrdersResult').innerHTML = '';
        };
        window.closeMyOrdersModal = function() {
            document.getElementById('myOrdersModal').classList.remove('show');
        };

        window.fetchMyOrders = async function() {
            const phone = document.getElementById('searchOrderPhone').value.trim();
            const resultDiv = document.getElementById('myOrdersResult');
            if (!phone) {
                resultDiv.innerHTML = '<p style="color:#b45309;font-size:13px;text-align:center;">Tafadhali weka namba ya simu.</p>';
                return;
            }
            resultDiv.innerHTML = '<p style="color:#475569;text-align:center;font-size:13px;"><i class="fas fa-spinner fa-spin"></i> Inatafuta...</p>';

            try {
                const q = query(collection(db, "orders"), where("phone", "==", phone));
                const querySnapshot = await getDocs(q);
                let ordersList = [];
                querySnapshot.forEach(docSnap => {
                    ordersList.push({ id: docSnap.id, ...docSnap.data() });
                });

                if (ordersList.length === 0) {
                    resultDiv.innerHTML = '<p style="color:#475569;text-align:center;font-size:13px;">Hakuna oda zilizopatikana.</p>';
                    return;
                }

                let html = '';
                for (let o of ordersList) {
                    let isCompleted = o.status === 'completed';
                    let whatsappLink = '#';
                    if (o.productId) {
                        const prodSnap = await getDocs(collection(db, "products"));
                        prodSnap.forEach(pDoc => {
                            if (pDoc.id === o.productId) {
                                whatsappLink = pDoc.data().whatsappLink || '#';
                            }
                        });
                    }

                    html += `
                        <div class="order-item-card">
                            <div class="order-info">
                                <h4>${o.description || 'WhatsApp Group'}</h4>
                                <p>TSh ${(o.amount || 0).toLocaleString()} · ${o.date || ''}</p>
                                <span class="badge-status ${isCompleted ? 'badge-completed' : 'badge-pending'}">
                                    ${isCompleted ? '✅ Imekamilika' : '⏳ Inasubiri'}
                                </span>
                                ${isCompleted && whatsappLink !== '#' ? `<br><a href="${whatsappLink}" target="_blank" class="btn-access-link"><i class="fab fa-whatsapp"></i> Fungua Group</a>` : ''}
                                ${!isCompleted ? '<p style="font-size:11px;color:#b45309;margin-top:4px;">Thibitisha malipo kwenye simu yako.</p>' : ''}
                            </div>
                        </div>
                    `;
                }
                resultDiv.innerHTML = html;
            } catch (e) {
                resultDiv.innerHTML = '<p style="color:#ef4444;text-align:center;font-size:13px;">Hitilafu ya mtandao.</p>';
            }
        };

        // --- Auth Modal ---
        window.openAuthModal = function(type) {
            const modal = document.getElementById('authModal');
            const title = document.getElementById('authModalTitle');
            const subtitle = document.getElementById('authModalSubtitle');
            const nameGroup = document.getElementById('nameGroup');
            const submitBtn = document.getElementById('authSubmitBtn');

            modal.classList.add('show');
            if (type === 'signup') {
                title.textContent = 'Fungua Akaunti';
                subtitle.textContent = 'Jiunge nasi kwa dakika chache.';
                nameGroup.style.display = 'block';
                submitBtn.textContent = 'Jiandikishe';
            } else {
                title.textContent = 'Ingia kwenye Akaunti';
                subtitle.textContent = 'Weka barua pepe na neno la siri.';
                nameGroup.style.display = 'none';
                submitBtn.textContent = 'Ingia';
            }
        };

        window.closeAuthModal = function() {
            document.getElementById('authModal').classList.remove('show');
        };

        // --- Auth Form Submit ---
        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const name = document.getElementById('authName').value.trim() || email.split('@')[0];
            currentUser = { email, name };
            localStorage.setItem('pataLinkUser', JSON.stringify(currentUser));
            updateAuthUI();
            closeAuthModal();
            alert('✅ Umefanikiwa kuingia!');
        });

        // --- Payment Form ---
        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const phone = document.getElementById('payPhone').value.trim();
            const amount = document.getElementById('payAmount').value;
            const description = document.getElementById('payDescription').value;
            const productId = document.getElementById('payProductId').value;
            const btn = document.getElementById('payBtn');

            if (!phone || phone.length < 10) {
                alert('Tafadhali weka namba sahihi ya simu.');
                return;
            }

            btn.textContent = 'Inatuma...';
            btn.disabled = true;

            try {
                const response = await fetch('/api/v1/collect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, amount, description, productId })
                });
                const data = await response.json();

                if (data.success) {
                    alert('✅ ' + data.message + '\nAngalia simu yako na thibitisha malipo.');
                    closeCheckout();
                } else {
                    alert('❌ ' + (data.message || 'Hitilafu imetokea. Jaribu tena.'));
                }
            } catch (err) {
                alert('❌ Hitilafu ya mtandao. Hakikisha umeunganishwa.');
            } finally {
                btn.textContent = 'Lipa Sasa';
                btn.disabled = false;
            }
        });

        // --- INIT ---
        fetchProducts();
        // Auto refresh every 15s
        setInterval(fetchProducts, 15000);
    </script>
</body>
  </html>
