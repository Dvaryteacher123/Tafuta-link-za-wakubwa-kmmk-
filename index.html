<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pata Link za WhatsApp - Ultra Large Cards</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
            color: #0f172a;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */
        header {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            padding: 14px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
            gap: 12px;
        }
        header .brand {
            font-size: 26px;
            font-weight: 900;
            background: linear-gradient(135deg, #0ea5e9, #7c3aed);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        header .brand i {
            -webkit-text-fill-color: #0ea5e9;
            font-size: 28px;
        }

        .header-center {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            max-width: 600px;
            min-width: 200px;
        }
        .header-center .search-box {
            display: flex;
            align-items: center;
            background: #fff;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 50px;
            padding: 0 20px;
            flex: 1;
            transition: 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .header-center .search-box:focus-within {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.08);
        }
        .header-center .search-box i {
            color: #94a3b8;
            font-size: 18px;
        }
        .header-center .search-box input {
            border: none;
            background: transparent;
            padding: 14px 14px;
            font-size: 16px;
            color: #0f172a;
            outline: none;
            width: 100%;
            font-family: 'Inter', sans-serif;
        }
        .header-center .search-box input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .nav-link-btn {
            background: rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0, 0, 0, 0.05);
            padding: 10px 18px;
            border-radius: 50px;
            color: #1e293b;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .nav-link-btn:hover {
            background: rgba(0, 0, 0, 0.06);
            border-color: rgba(0, 0, 0, 0.1);
        }
        .nav-link-btn.whatsapp {
            background: rgba(16, 185, 129, 0.12);
            border-color: rgba(16, 185, 129, 0.15);
            color: #0b7a4b;
        }
        .nav-link-btn.whatsapp:hover {
            background: rgba(16, 185, 129, 0.2);
        }
        .nav-link-btn.primary {
            background: #0ea5e9;
            border-color: #0ea5e9;
            color: #fff;
            box-shadow: 0 2px 12px rgba(14, 165, 233, 0.25);
        }
        .nav-link-btn.primary:hover {
            background: #38bdf8;
            border-color: #38bdf8;
            box-shadow: 0 4px 20px rgba(14, 165, 233, 0.35);
        }
        .nav-link-btn.lang-btn {
            background: transparent;
            border-color: transparent;
            font-weight: 700;
            color: #0ea5e9;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .nav-link-btn.lang-btn:hover {
            background: rgba(14, 165, 233, 0.06);
        }

        /* ZOOM CONTROL */
        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            padding: 6px 14px 6px 18px;
            border-radius: 50px;
            border: 1px solid rgba(0, 0, 0, 0.04);
        }
        .zoom-controls label {
            font-size: 12px;
            font-weight: 600;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .zoom-controls label i {
            font-size: 14px;
            color: #0ea5e9;
        }
        .zoom-controls input[type="range"] {
            width: 100px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #cbd5e1;
            border-radius: 2px;
            outline: none;
            transition: 0.3s;
        }
        .zoom-controls input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0ea5e9, #7c3aed);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(14, 165, 233, 0.3);
        }
        .zoom-controls input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0ea5e9, #7c3aed);
            cursor: pointer;
            border: none;
        }
        .zoom-controls .zoom-value {
            font-size: 13px;
            font-weight: 700;
            color: #0ea5e9;
            min-width: 32px;
            text-align: center;
        }
        .zoom-btn {
            background: rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(0, 0, 0, 0.06);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            color: #1e293b;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .zoom-btn:hover {
            background: rgba(14, 165, 233, 0.1);
            border-color: #0ea5e9;
            color: #0ea5e9;
        }

        /* 3D CURVED CONTAINER - ULTRA LARGE */
        .arc-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 2000px;
            padding: 20px 30px 40px 30px;
            min-height: 82vh;
            position: relative;
            transition: all 0.3s ease;
        }

        .arc-track {
            position: relative;
            width: 100%;
            max-width: 1300px;
            height: 820px;
            transform-style: preserve-3d;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            transform-origin: center center;
        }

        /* CARD - ULTRA LARGE LANDSCAPE */
        .card-3d {
            position: absolute;
            width: 850px;
            height: 470px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 44px;
            overflow: hidden;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.08), 0 8px 20px rgba(0, 0, 0, 0.03);
            transition: all 0.65s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            will-change: transform, opacity, filter;
            cursor: grab;
            display: flex;
            flex-direction: row;
            backface-visibility: hidden;
        }
        .card-3d:active {
            cursor: grabbing;
        }

        .card-3d .card-media {
            width: 74%;
            height: 100%;
            background: #e2e8f0;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .card-3d .card-media img,
        .card-3d .card-media video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-3d .card-body {
            width: 26%;
            padding: 26px 24px 24px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.98);
        }
        .card-3d .card-body .card-text {
            flex: 1;
        }
        .card-3d .card-body h3 {
            font-size: 26px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
            line-height: 1.2;
        }
        .card-3d .card-body .desc {
            font-size: 16px;
            color: #475569;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 14px;
        }
        .card-3d .card-body .price {
            font-size: 28px;
            font-weight: 800;
            color: #0ea5e9;
            margin-bottom: 16px;
        }
        .card-3d .card-body .btn-buy-3d {
            width: 100%;
            padding: 18px 0;
            background: linear-gradient(135deg, #0ea5e9, #7c3aed);
            border: none;
            border-radius: 60px;
            color: #fff;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 6px 25px rgba(14, 165, 233, 0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .card-3d .card-body .btn-buy-3d:active {
            transform: scale(0.96);
        }

        /* POSITIONS - ULTRA LARGE */
        .card-3d.pos-0 {
            transform: translateX(0px) translateY(0px) translateZ(200px) rotateY(-4deg) scale(1);
            opacity: 1;
            z-index: 10;
            filter: blur(0px);
            box-shadow: 0 70px 100px rgba(0, 0, 0, 0.12), 0 0 70px rgba(14, 165, 233, 0.1);
            border-color: rgba(14, 165, 233, 0.15);
        }
        .card-3d.pos-1 {
            transform: translateX(260px) translateY(110px) translateZ(100px) rotateY(-10deg) scale(0.88);
            opacity: 0.7;
            z-index: 7;
            filter: blur(0.8px);
            box-shadow: 0 40px 60px rgba(0, 0, 0, 0.06);
            border-color: rgba(0, 0, 0, 0.04);
        }
        .card-3d.pos-2 {
            transform: translateX(440px) translateY(250px) translateZ(0px) rotateY(-14deg) scale(0.76);
            opacity: 0.42;
            z-index: 4;
            filter: blur(2px);
            box-shadow: 0 35px 50px rgba(0, 0, 0, 0.04);
        }
        .card-3d.pos--1 {
            transform: translateX(-260px) translateY(110px) translateZ(100px) rotateY(-2deg) scale(0.88);
            opacity: 0.7;
            z-index: 7;
            filter: blur(0.8px);
            box-shadow: 0 40px 60px rgba(0, 0, 0, 0.06);
            border-color: rgba(0, 0, 0, 0.04);
        }
        .card-3d.pos--2 {
            transform: translateX(-440px) translateY(250px) translateZ(0px) rotateY(2deg) scale(0.76);
            opacity: 0.42;
            z-index: 4;
            filter: blur(2px);
            box-shadow: 0 35px 50px rgba(0, 0, 0, 0.04);
        }
        .card-3d.pos-hidden {
            transform: translateX(0px) translateY(500px) translateZ(-400px) scale(0.5);
            opacity: 0;
            z-index: 0;
            filter: blur(10px);
            pointer-events: none;
        }

        /* NAVIGATION */
        .arc-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            margin: 8px 0 18px 0;
            flex-shrink: 0;
        }
        .arc-nav .nav-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.06);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            color: #0f172a;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }
        .arc-nav .nav-btn:active {
            transform: scale(0.92);
        }
        .arc-nav .dots {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .arc-nav .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.12);
            transition: 0.3s;
            cursor: pointer;
        }
        .arc-nav .dot.active {
            width: 34px;
            border-radius: 6px;
            background: #0ea5e9;
        }

        /* FOOTER */
        .footer-support {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            padding: 16px 24px;
            text-align: center;
            font-size: 15px;
            color: #475569;
            flex-shrink: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px 28px;
        }
        .footer-support a {
            color: #0ea5e9;
            text-decoration: none;
            font-weight: 600;
        }
        .footer-support a:hover {
            text-decoration: underline;
        }
        .footer-support i {
            margin-right: 6px;
        }

        /* MODALS */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(14px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: modalFadeIn 0.35s ease;
        }
        .modal.show {
            display: flex;
        }
        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(12px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-content {
            background: rgba(255, 255, 255, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 36px;
            padding: 40px 36px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 50px 90px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        .modal-content h3 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
            color: #0f172a;
            letter-spacing: -0.3px;
        }
        .modal-content .subtitle {
            color: #475569;
            font-size: 15px;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #475569;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 16px 20px;
            background: #f8fafc;
            border: 1px solid rgba(0, 0, 0, 0.06);
            border-radius: 18px;
            color: #0f172a;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.08);
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 28px;
        }
        .btn-cancel {
            background: transparent;
            border: 1px solid rgba(0, 0, 0, 0.08);
            color: #475569;
            padding: 14px 24px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: 0.3s;
        }
        .btn-cancel:hover {
            background: rgba(0, 0, 0, 0.02);
        }
        .btn-submit {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            color: #fff;
            padding: 14px 30px;
            border-radius: 16px;
            font-weight: 700;
            cursor: pointer;
            font-size: 15px;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.25);
            transition: 0.3s;
        }
        .btn-submit:active {
            transform: scale(0.96);
        }

        /* Order items */
        .order-item-card {
            background: #f8fafc;
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: 18px;
            padding: 16px 18px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .order-info h4 {
            font-size: 15px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 2px;
        }
        .order-info p {
            font-size: 13px;
            color: #475569;
        }
        .badge-status {
            padding: 4px 14px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            display: inline-block;
        }
        .badge-completed {
            background: rgba(16, 185, 129, 0.12);
            color: #0b7a4b;
            border: 1px solid rgba(16, 185, 129, 0.12);
        }
        .badge-pending {
            background: rgba(245, 158, 11, 0.12);
            color: #b45309;
            border: 1px solid rgba(245, 158, 11, 0.12);
        }
        .btn-access-link {
            background: rgba(14, 165, 233, 0.1);
            color: #0ea5e9;
            padding: 4px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 4px;
            border: 1px solid rgba(14, 165, 233, 0.1);
            transition: 0.3s;
        }
        .btn-access-link:hover {
            background: rgba(14, 165, 233, 0.18);
        }
        .search-row {
            display: flex;
            gap: 10px;
        }
        .search-row input {
            flex: 1;
        }
        .search-row .btn-submit {
            padding: 0 18px;
            white-space: nowrap;
        }
        #myOrdersResult {
            max-height: 240px;
            overflow-y: auto;
            margin-top: 14px;
        }
        #myOrdersResult::-webkit-scrollbar {
            width: 4px;
        }
        #myOrdersResult::-webkit-scrollbar-track {
            background: transparent;
        }
        #myOrdersResult::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }

        /* RESPONSIVE */
        @media (max-width: 1200px) {
            .arc-track {
                max-width: 1000px;
                height: 700px;
            }
            .card-3d {
                width: 660px;
                height: 370px;
                border-radius: 36px;
            }
            .card-3d .card-media {
                width: 72%;
            }
            .card-3d .card-body {
                width: 28%;
                padding: 20px 18px 18px 16px;
            }
            .card-3d .card-body h3 {
                font-size: 22px;
            }
            .card-3d .card-body .desc {
                font-size: 14px;
            }
            .card-3d .card-body .price {
                font-size: 24px;
            }
            .card-3d .card-body .btn-buy-3d {
                font-size: 16px;
                padding: 16px 0;
            }
            .card-3d.pos-1 {
                transform: translateX(190px) translateY(90px) translateZ(70px) rotateY(-10deg) scale(0.86);
            }
            .card-3d.pos--1 {
                transform: translateX(-190px) translateY(90px) translateZ(70px) rotateY(-2deg) scale(0.86);
            }
            .card-3d.pos-2 {
                transform: translateX(330px) translateY(200px) translateZ(0px) rotateY(-14deg) scale(0.74);
            }
            .card-3d.pos--2 {
                transform: translateX(-330px) translateY(200px) translateZ(0px) rotateY(2deg) scale(0.74);
            }
            .card-3d.pos-0 {
                transform: translateX(0px) translateY(0px) translateZ(160px) rotateY(-4deg) scale(1);
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 12px 16px;
                gap: 10px;
            }
            header .brand {
                font-size: 20px;
            }
            .header-center {
                order: 3;
                flex-basis: 100%;
                max-width: 100%;
                margin-top: 4px;
            }
            .header-center .search-box input {
                font-size: 14px;
                padding: 10px 12px;
            }
            .header-nav .nav-link-btn {
                font-size: 11px;
                padding: 6px 12px;
            }
            .nav-link-btn.lang-btn {
                font-size: 10px;
            }
            .zoom-controls input[type="range"] {
                width: 70px;
            }
            .zoom-controls {
                padding: 4px 10px 4px 14px;
            }

            .arc-track {
                height: 520px;
                max-width: 100%;
            }
            .card-3d {
                width: 420px;
                height: 240px;
                border-radius: 26px;
            }
            .card-3d .card-media {
                width: 70%;
            }
            .card-3d .card-body {
                width: 30%;
                padding: 14px 14px 12px 12px;
            }
            .card-3d .card-body h3 {
                font-size: 17px;
                margin-bottom: 4px;
            }
            .card-3d .card-body .desc {
                font-size: 12px;
                -webkit-line-clamp: 2;
                margin-bottom: 6px;
            }
            .card-3d .card-body .price {
                font-size: 19px;
                margin-bottom: 10px;
            }
            .card-3d .card-body .btn-buy-3d {
                font-size: 13px;
                padding: 12px 0;
            }

            .card-3d.pos-1 {
                transform: translateX(120px) translateY(65px) translateZ(50px) rotateY(-10deg) scale(0.85);
            }
            .card-3d.pos--1 {

        window.toggleLanguage = function() {

            updateLanguageUI();

        function updateLanguageUI() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (key) el.textContent = t(key);

            document.getElementById('langLabel').textContent = currentLang.toUpperCase();
            document.getElementById('searchInput').placeholder = t('searchPlaceholder');
        }

        function updateAuthUI() {
            const topBtn = document.querySelector('.nav-link-btn.primary');
            if (currentUser) {

                    updateAuthUI();
                    alert(t('logoutMsg'));
                };
            } else {
                topBtn.textContent = t('signup');
                topBtn.onclick = () => openAuthModal('signup');
            }
        }

        // --- ZOOM CONTROLS ---
        let currentZoom = 100;

        window.updateZoom = function(value) {
            currentZoom = parseInt(value);
            document.getElementById('zoomValue').textContent = currentZoom + '%';
            const track = document.getElementById('arcTrack');
            const scale = currentZoom / 100;
            track.style.transform = `scale(${scale})`;
        };

        window.zoomIn = function() {
            const slider = document.getElementById('zoomSlider');
            let val = parseInt(slider.value) + 10;
            if (val > 150) val = 150;
            slider.value = val;
            updateZoom(val);
        };

        window.zoomOut = function() {
            const slider = document.getElementById('zoomSlider');
            let val = parseInt(slider.value) - 10;
            if (val < 50) val = 50;
            slider.value = val;
            updateZoom(val);
        };

        // --- Arc styles ---
        function getArcStyles(offset) {
            let norm = offset;
            if (norm > 2) norm = 2;
            if (norm < -2) norm = -2;

            const maxAngle = 22;
            const angle = (norm / 2) * maxAngle;
            const rad = angle * Math.PI / 180;
            const radius = 450;

            const x = radius * Math.sin(rad);
            const y = radius * (1 - Math.cos(rad));

            const scale = 1 - Math.abs(norm) * 0.12;
            const opacity = 1 - Math.abs(norm) * 0.22;
            const blur = Math.abs(norm) * 2;
            const zIndex = Math.round(10 - Math.abs(norm) * 3);
            const rotateY = -rad * (180 / Math.PI) * 0.5;
            const translateZ = 150 - Math.abs(norm) * 75;

            return {
                transform: `translateX(${x}px) translateY(${y}px) translateZ(${translateZ}px) rotateY(${rotateY}deg) scale(${scale})`,
                opacity: opacity,
                filter: `blur(${blur}px)`,
                zIndex: zIndex,
                boxShadow: norm === 0 ? '0 70px 100px rgba(0,0,0,0.12), 0 0 70px rgba(14,165,233,0.1)' : '0 40px 60px rgba(0,0,0,0.06)',
                borderColor: norm === 0 ? 'rgba(14,165,233,0.15)' : 'rgba(0,0,0,0.04)'
            };
        }

        // --- Render Cards ---
        function renderCards() {
            const displayProducts = filteredProducts.length > 0 ? filteredProducts : products;
            const track = document.getElementById('arcTrack');
            const dotsContainer = document.getElementById('dotsContainerArc');

            if (!displayProducts.length) {
                const msg = products.length === 0 ? t('noGroups') : t('noResults');
                const sub = products.length === 0 ? t('adminSoon') : '';
                track.innerHTML = `
                    <div class="no-results">
                        <i class="fas fa-box-open"></i>
                        <p>${msg}</p>
                        ${sub ? `<span>${sub}</span>` : ''}
                    </div>
                `;
                dotsContainer.innerHTML = '';
                return;
            }

            if (currentIndex >= displayProducts.length) currentIndex = 0;
            const total = displayProducts.length;

            let dotsHtml = '';
            for (let i = 0; i < total; i++) {
                dotsHtml += `<div class="dot ${i === currentIndex ? 'active' : ''}" data-index="${i}"></div>`;
            }
            dotsContainer.innerHTML = dotsHtml;

            let html = '';
            for (let i = 0; i < total; i++) {
                const p = displayProducts[i];
                let offset = i - currentIndex;
                if (offset > total / 2) offset -= total;
                if (offset < -total / 2) offset += total;

                const styles = getArcStyles(offset);
                const isHidden = Math.abs(offset) > 2;

                let mediaHtml = `<img src="${p.imageUrl || 'https://via.placeholder.com/850x470/e2e8f0/94a3b8?text=Group'}" alt="${p.title}" loading="lazy" />`;
                if (p.videoUrl && !isHidden) {
                    mediaHtml = `<video src="${p.videoUrl}" autoplay muted loop playsinline></video>`;
                }

                const cardClasses = `card-3d ${isHidden ? 'pos-hidden' : ''}`;
                const styleAttr = isHidden ? '' :
                    `transform:${styles.transform};opacity:${styles.opacity};filter:${styles.filter};z-index:${styles.zIndex};box-shadow:${styles.boxShadow};border-color:${styles.borderColor};`;

                const buyText = t('buyNow');

                html += `
                    <div class="${cardClasses}" style="${styleAttr}" data-index="${i}">
                        <div class="card-media">${mediaHtml}</div>
                        <div class="card-body">
                            <div class="card-text">
                                <h3>${p.title}</h3>
                                <p class="desc">${p.description || ''}</p>
                                <div class="price">TSh ${(p.price || 0).toLocaleString()}</div>
                            </div>
                            <button class="btn-buy-3d" onclick="handleBuy('${p.id}', '${p.title.replace(/'/g, "\\'")}', ${p.price || 0})">
                                <i class="fas fa-bolt"></i> ${buyText}
                            </button>
                        </div>
                    </div>
                `;
            }
            track.innerHTML = html;

            document.querySelectorAll('.dot').forEach(dot => {
                dot.addEventListener('click', () => {
                    const idx = parseInt(dot.dataset.index);
                    if (idx !== currentIndex) {
                        currentIndex = idx;
                        renderCards();
                    }
                });
            });

            // Re-apply zoom after render
            const slider = document.getElementById('zoomSlider');
            updateZoom(slider.value);
        }

        // --- Filter ---
        window.filterGroups = function() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) {
                filteredProducts = [];
            } else {
                filteredProducts = products.filter(p =>
                    p.title.toLowerCase().includes(query) ||
                    (p.description && p.description.toLowerCase().includes(query))
                );
            }
            currentIndex = 0;
            renderCards();
        };

        // --- Navigation ---
        function nextSlide() {
            const displayProducts = filteredProducts.length > 0 ? filteredProducts : products;
            if (!displayProducts.length) return;
            currentIndex = (currentIndex + 1) % displayProducts.length;
            renderCards();
        }

        function prevSlide() {
            const displayProducts = filteredProducts.length > 0 ? filteredProducts : products;
            if (!displayProducts.length) return;
            currentIndex = (currentIndex - 1 + displayProducts.length) % displayProducts.length;
            renderCards();
        }

        document.getElementById('prevBtnArc').addEventListener('click', prevSlide);
        document.getElementById('nextBtnArc').addEventListener('click', nextSlide);

        // --- Swipe/Drag ---
        let startX = 0,
            isDragging = false;
        const container = document.querySelector('.arc-container');

        container.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
        }, { passive: true });

        container.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const diff = startX - e.touches[0].clientX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) nextSlide();
                else prevSlide();
                isDragging = false;
            }
        }, { passive: true });

        container.addEventListener('touchend', () => { isDragging = false; }, { passive: true });

        let mouseDown = false,
            mouseStartX = 0;
        container.addEventListener('mousedown', (e) => {
            mouseDown = true;
            mouseStartX = e.clientX;
        });
        container.addEventListener('mousemove', (e) => {
            if (!mouseDown) return;
            const diff = mouseStartX - e.clientX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) nextSlide();
                else prevSlide();
                mouseDown = false;
            }
        });
        container.addEventListener('mouseup', () => { mouseDown = false; });
        container.addEventListener('mouseleave', () => { mouseDown = false; });

        // --- Fetch Products ---
        async function fetchProducts() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                products = [];
                querySnapshot.forEach((doc) => {
                    products.push({ id: doc.id, ...doc.data() });
                });
                filteredProducts = [];
                document.getElementById('searchInput').value = '';
                currentIndex = 0;
                renderCards();
            } catch (e) {
                console.error(e);
                document.getElementById('arcTrack').innerHTML = `<p style="color:#ef4444;text-align:center;width:100%;padding:40px;">Imeshindikana kupakia data.</p>`;
            }
        }

        // --- Buy Handler ---
        window.handleBuy = function(id, title, price) {
            if (!currentUser) {
                alert(t('loginRequired'));
                openAuthModal('login');
                return;
            }
            document.getElementById('checkoutModal').classList.add('show');
            document.getElementById('modalItemTitle').textContent = title + ' — TSh ' + price.toLocaleString();
            document.getElementById('payProductId').value = id;
            document.getElementById('payAmount').value = price;
            document.getElementById('payDescription').value = 'Malipo ya Group: ' + title;
            document.getElementById('checkoutTitle').textContent = t('checkoutTitle');
            document.getElementById('phoneLabel').textContent = t('phoneLabel');
            document.getElementById('cancelBtn').textContent = t('cancel');
            document.getElementById('payBtn').textContent = t('payNow');
        };

        window.closeCheckout = function() {
            document.getElementById('checkoutModal').classList.remove('show');
        };

        // --- My Orders ---
        window.openMyOrdersModal = function() {
            document.getElementById('myOrdersModal').classList.add('show');
            document.getElementById('myOrdersResult').innerHTML = '';
            document.getElementById('ordersTitle').textContent = t('ordersTitle');
            document.getElementById('ordersSubtitle').textContent = t('ordersSubtitle');
            document.getElementById('ordersPhoneLabel').textContent = t('ordersPhoneLabel');
            document.getElementById('ordersSearchBtn').textContent = t('ordersSearch');
            document.getElementById('ordersCloseBtn').textContent = t('ordersClose');
        };

        window.closeMyOrdersModal = function() {
            document.getElementById('myOrdersModal').classList.remove('show');
        };

        window.fetchMyOrders = async function() {
            const phone = document.getElementById('searchOrderPhone').value.trim();
            const resultDiv = document.getElementById('myOrdersResult');
            if (!phone) {
                resultDiv.innerHTML = `<p style="color:#b45309;font-size:14px;text-align:center;">${t('enterPhone')}</p>`;
                return;
            }
            resultDiv.innerHTML = `<p style="color:#475569;text-align:center;font-size:14px;"><i class="fas fa-spinner fa-spin"></i> ${t('searchOrders')}</p>`;

            try {
                const q = query(collection(db, "orders"), where("phone", "==", phone));
                const querySnapshot = await getDocs(q);
                let ordersList = [];
                querySnapshot.forEach(docSnap => {
                    ordersList.push({ id: docSnap.id, ...docSnap.data() });
                });

                if (ordersList.length === 0) {
                    resultDiv.innerHTML = `<p style="color:#475569;text-align:center;font-size:14px;">${t('noOrders')}</p>`;
                    return;
                }

                let html = '';
                for (let o of ordersList) {
                    let isCompleted = o.status === 'completed';
                    let whatsappLink = '#';
                    if (o.productId) {
                        const prodSnap = await getDocs(collection(db, "products"));
                        prodSnap.forEach(pDoc => {
                            if (pDoc.id === o.productId) {
                                whatsappLink = pDoc.data().whatsappLink || '#';
                            }
                        });
                    }

                    const statusText = isCompleted ? t('completed') : t('pending');
                    const statusClass = isCompleted ? 'badge-completed' : 'badge-pending';
                    const waitingText = !isCompleted ? `<p style="font-size:12px;color:#b45309;margin-top:4px;">${t('waitingPayment')}</p>` : '';
                    const groupLink = isCompleted && whatsappLink !== '#' ?
                        `<br><a href="${whatsappLink}" target="_blank" class="btn-access-link"><i class="fab fa-whatsapp"></i> ${t('openGroup')}</a>` : '';

                    html += `
                        <div class="order-item-card">
                            <div class="order-info">
                                <h4>${o.description || 'WhatsApp Group'}</h4>
                                <p>TSh ${(o.amount || 0).toLocaleString()} · ${o.date || ''}</p>
                                <span class="badge-status ${statusClass}">${isCompleted ? '✅' : '⏳'} ${statusText}</span>
                                ${groupLink}
                                ${waitingText}
                            </div>
                        </div>
                    `;
                }
                resultDiv.innerHTML = html;
            } catch (e) {
                resultDiv.innerHTML = `<p style="color:#ef4444;text-align:center;font-size:14px;">${t('networkError')}</p>`;
            }
        };

        // --- Auth ---
        window.openAuthModal = function(type) {
            const modal = document.getElementById('authModal');
            const title = document.getElementById('authModalTitle');
            const subtitle = document.getElementById('authModalSubtitle');
            const nameGroup = document.getElementById('nameGroup');
            const submitBtn = document.getElementById('authSubmitBtn');

            modal.classList.add('show');
            if (type === 'signup') {
                title.textContent = t('authSignupTitle');
                subtitle.textContent = t('authSignupSub');
                nameGroup.style.display = 'block';
                submitBtn.textContent = t('authSubmitSignup');
                document.getElementById('nameLabel').textContent = t('nameLabel');
            } else {
                title.textContent = t('authLoginTitle');
                subtitle.textContent = t('authLoginSub');
                nameGroup.style.display = 'none';
                submitBtn.textContent = t('authSubmitLogin');
            }
            document.getElementById('emailLabel').textContent = t('emailLabel');
            document.getElementById('passLabel').textContent = t('passLabel');
            document.getElementById('authCancelBtn').textContent = t('authCancel');
        };

        window.closeAuthModal = function() {
            document.getElementById('authModal').classList.remove('show');
        };

        document.getElementById('authForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const name = document.getElementById('authName').value.trim() || email.split('@')[0];
            currentUser = { email, name };
            localStorage.setItem('pataLinkUser', JSON.stringify(currentUser));
            updateAuthUI();
            closeAuthModal();
            alert(t('loginSuccess'));
        });

        // --- Payment ---
        document.getElementById('paymentForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const phone = document.getElementById('payPhone').value.trim();
            const amount = document.getElementById('payAmount').value;
            const description = document.getElementById('payDescription').value;
            const productId = document.getElementById('payProductId').value;
            const btn = document.getElementById('payBtn');

            if (!phone || phone.length < 10) {
                alert(t('enterValidPhone'));
                return;
            }

            btn.textContent = t('sending');
            btn.disabled = true;

            try {
                const response = await fetch('/api/v1/collect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, amount, description, productId })
                });
                const data = await response.json();

                if (data.success) {
                    alert(t('paymentSuccess') + '\n' + t('paymentSent'));
                    closeCheckout();
                } else {
                    alert('❌ ' + (data.message || t('tryAgain')));
                }
            } catch (err) {
                alert('❌ ' + t('networkError'));
            } finally {
                btn.textContent = t('payNow');
                btn.disabled = false;
            }
        });

        // --- INIT ---
        updateAuthUI();
        fetchProducts();
        setInterval(fetchProducts, 20000);

        document.getElementById('searchInput').placeholder = t('searchPlaceholder');

        document.querySelectorAll('[data-i18n]').forEach(el => {
            el.textContent = t(el.dataset.i18n);
        });

        // Initialize zoom
        setTimeout(() => {
            const slider = document.getElementById('zoomSlider');
            updateZoom(slider.value);
        }, 100);
    </script>
</body>
  </html>
