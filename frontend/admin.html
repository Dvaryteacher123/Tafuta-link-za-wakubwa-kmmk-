<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - Pata Link WhatsApp Groups</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #ffffff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; overflow: hidden; }

        /* Background Orbs */
        .bg-orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.15; animation: float 10s ease-in-out infinite; }
        .bg-orb-1 { width: 500px; height: 500px; background: #4F46E5; top: -10%; right: -10%; animation-delay: 0s; }
        .bg-orb-2 { width: 400px; height: 400px; background: #7C3AED; bottom: -10%; left: -10%; animation-delay: 3s; }
        .bg-orb-3 { width: 300px; height: 300px; background: #10B981; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 6s; }
        @keyframes float { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(30px,-30px) scale(1.1); } }

        /* Card */
        .admin-card { position: relative; z-index: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 48px 40px; max-width: 440px; width: 100%; backdrop-filter: blur(20px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .admin-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(135deg, #4F46E5, #7C3AED); border-radius: 24px 24px 0 0; }

        .admin-badge { display: inline-flex; align-items: center; gap: 8px; padding: 4px 16px; background: rgba(79,70,229,0.2); border: 1px solid rgba(79,70,229,0.3); border-radius: 50px; font-size: 12px; font-weight: 600; color: #4F46E5; margin-bottom: 20px; }
        .admin-badge i { font-size: 14px; }

        .admin-logo { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 28px; font-weight: 800; margin-bottom: 8px; }
        .admin-logo i { color: #4F46E5; }
        .admin-title { font-size: 28px; font-weight: 800; text-align: center; margin-bottom: 4px; }
        .admin-subtitle { color: #a0a0b0; text-align: center; margin-bottom: 32px; font-size: 15px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .form-group label i { color: #4F46E5; width: 18px; }
        .form-group input { width: 100%; padding: 14px 16px; background: #1a1a2e; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #ffffff; font-size: 15px; transition: 0.3s; }
        .form-group input:focus { outline: none; border-color: #4F46E5; box-shadow: 0 0 20px rgba(79,70,229,0.15); }
        .form-group input::placeholder { color: #6B7280; }

        .form-options { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 24px; }
        .checkbox-label { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #a0a0b0; cursor: pointer; }
        .checkbox-label input[type="checkbox"] { width: 18px; height: 18px; accent-color: #4F46E5; cursor: pointer; }
        .forgot-link { color: #6B7280; font-size: 14px; text-decoration: none; transition: 0.3s; }
        .forgot-link:hover { color: #4F46E5; }

        .login-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #4F46E5, #7C3AED); border: none; border-radius: 10px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(79,70,229,0.4); }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        .form-error { color: #EF4444; font-size: 13px; margin-top: 4px; display: none; }
        .form-error.visible { display: block; }

        .admin-support { margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; gap: 8px; color: #6B7280; font-size: 13px; }
        .admin-support a { color: #4F46E5; text-decoration: none; }
        .admin-support a:hover { text-decoration: underline; }

        .spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-top: 2px solid #fff; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 48px; }
        .password-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #6B7280; cursor: pointer; font-size: 18px; padding: 4px; }
        .password-toggle:hover { color: #fff; }
    </style>
</head>
<body>

    <!-- Background Orbs -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <!-- Admin Login Card -->
    <div class="admin-card">

        <!-- Badge -->
        <div class="admin-badge">
            <i class="fas fa-shield-alt"></i> Admin Panel
        </div>

        <!-- Logo -->
        <div class="admin-logo">
            <i class="fas fa-comments"></i>
            <span>Pata Link</span>
        </div>

        <!-- Title -->
        <h1 class="admin-title">Admin Login</h1>
        <p class="admin-subtitle">Login to manage your website</p>

        <!-- Login Form -->
        <form id="adminLoginForm">

            <!-- Email -->
            <div class="form-group">
                <label for="adminEmail"><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" id="adminEmail" placeholder="Enter admin email" required autocomplete="email" />
                <div class="form-error" id="emailError"></div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="adminPassword"><i class="fas fa-lock"></i> Password</label>
                <div class="password-wrapper">
                    <input type="password" id="adminPassword" placeholder="Enter admin password" required autocomplete="current-password" />
                    <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="form-error" id="passwordError"></div>
            </div>

            <!-- Options -->
            <div class="form-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="rememberMe" />
                    <span>Remember Me</span>
                </label>
                <a href="#" class="forgot-link" id="forgotLink">Forgot Password?</a>
            </div>

            <!-- Login Button -->
            <button type="submit" class="login-btn" id="loginBtn">
                <span id="loginText">Login</span>
                <div class="spinner" id="loginSpinner"></div>
            </button>

            <!-- Error Message -->
            <div class="form-error" id="loginError" style="display:none; text-align:center; margin-top:12px;"></div>
        </form>

        <!-- Support -->
        <div class="admin-support">
            <i class="fas fa-headset"></i>
            <span>Need help? </span>
            <a href="mailto:dullamanyama0@gmail.com">Contact Support</a>
        </div>

    </div>

    <!-- ========================================================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================================================= -->
    <script>
        // =========================================================
        // DOM Elements
        // =========================================================
        const form = document.getElementById('adminLoginForm');
        const emailInput = document.getElementById('adminEmail');
        const passwordInput = document.getElementById('adminPassword');
        const loginBtn = document.getElementById('loginBtn');
        const loginText = document.getElementById('loginText');
        const loginSpinner = document.getElementById('loginSpinner');
        const loginError = document.getElementById('loginError');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const togglePassword = document.getElementById('togglePassword');
        const rememberMe = document.getElementById('rememberMe');

        // =========================================================
        // API URL
        // =========================================================
        const API_BASE_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:5000/api' 
            : window.location.origin + '/api';

        // =========================================================
        // Toggle Password Visibility
        // =========================================================
        togglePassword.addEventListener('click', function() {
            const icon = this.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // =========================================================
        // Auto-login if Remember Me
        // =========================================================
        document.addEventListener('DOMContentLoaded', function() {
            const savedEmail = localStorage.getItem('adminEmail');
            const savedPassword = localStorage.getItem('adminPassword');
            const remember = localStorage.getItem('adminRemember');

            if (savedEmail) {
                emailInput.value = savedEmail;
            }
            if (savedPassword && remember === 'true') {
                passwordInput.value = savedPassword;
                rememberMe.checked = true;
                // Auto login after 1 second
                setTimeout(() => {
                    form.dispatchEvent(new Event('submit'));
                }, 500);
            }
        });

        // =========================================================
        // Form Submit - Login
        // =========================================================
        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Clear previous errors
            emailError.classList.remove('visible');
            passwordError.classList.remove('visible');
            loginError.style.display = 'none';
            loginError.textContent = '';

            // Get values
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            // Validate
            let isValid = true;

            if (!email) {
                emailError.textContent = 'Email is required';
                emailError.classList.add('visible');
                isValid = false;
            } else if (!email.includes('@')) {
                emailError.textContent = 'Please enter a valid email address';
                emailError.classList.add('visible');
                isValid = false;
            }

            if (!password) {
                passwordError.textContent = 'Password is required';
                passwordError.classList.add('visible');
                isValid = false;
            } else if (password.length < 6) {
                passwordError.textContent = 'Password must be at least 6 characters';
                passwordError.classList.add('visible');
                isValid = false;
            }

            if (!isValid) return;

            // Show loading
            loginBtn.disabled = true;
            loginText.textContent = 'Logging in...';
            loginSpinner.style.display = 'inline-block';

            try {
                // Call login API
                const response = await fetch(`${API_BASE_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    // Check if user is admin (dullamanyama0@gmail.com)
                    if (data.data.user.email !== 'dullamanyama0@gmail.com') {
                        loginError.textContent = 'Access denied. Admin only.';
                        loginError.style.display = 'block';
                        loginBtn.disabled = false;
                        loginText.textContent = 'Login';
                        loginSpinner.style.display = 'none';
                        return;
                    }

                    // Save token and user data
                    localStorage.setItem('adminToken', data.data.token);
                    localStorage.setItem('adminData', JSON.stringify(data.data.user));

                    // Save credentials if Remember Me is checked
                    if (rememberMe.checked) {
                        localStorage.setItem('adminEmail', email);
                        localStorage.setItem('adminPassword', password);
                        localStorage.setItem('adminRemember', 'true');
                    } else {
                        localStorage.removeItem('adminEmail');
                        localStorage.removeItem('adminPassword');
                        localStorage.removeItem('adminRemember');
                    }

                    // Redirect to admin dashboard
                    window.location.href = '/admin-dashboard.html';
                } else {
                    loginError.textContent = data.message || 'Login failed. Please try again.';
                    loginError.style.display = 'block';
                    loginBtn.disabled = false;
                    loginText.textContent = 'Login';
                    loginSpinner.style.display = 'none';
                }
            } catch (error) {
                console.error('Login error:', error);
                loginError.textContent = 'Network error. Please check your connection.';
                loginError.style.display = 'block';
                loginBtn.disabled = false;
                loginText.textContent = 'Login';
                loginSpinner.style.display = 'none';
            }
        });

        // =========================================================
        // Forgot Password Link
        // =========================================================
        document.getElementById('forgotLink').addEventListener('click', function(e) {
            e.preventDefault();
            alert('Please contact support at dullamanyama0@gmail.com to reset your password.');
        });

        console.log('🔐 Admin Login page loaded');
        console.log('📧 Admin: dullamanyama0@gmail.com');
    </script>

</body>
</html>
